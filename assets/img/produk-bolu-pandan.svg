<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <title>Bolu pandan lembut</title>
  <rect width="400" height="300" fill="#F7F4EA"/>
  <circle cx="200" cy="150" r="106" fill="#FFFFFF" fill-opacity="0.55"/>
  <ellipse cx="200" cy="248" rx="118" ry="14" fill="#1E5C3A" fill-opacity="0.08"/>

  <!-- piring -->
  <ellipse cx="200" cy="228" rx="118" ry="26" fill="#FFFFFF"/>
  <ellipse cx="200" cy="228" rx="92" ry="18" fill="#FBF8EE"/>

  <!-- potongan bolu -->
  <rect x="136" y="150" width="128" height="64" rx="12" fill="#90C3A3"/>
  <path d="M136 150 a64 64 0 0 1 128 0 z" fill="#90C3A3"/>
  <rect x="136" y="178" width="128" height="9" fill="#61A77E"/>
  <rect x="136" y="196" width="128" height="9" fill="#61A77E"/>

  <!-- serutan keju -->
  <g fill="#FAEBC6">
    <g transform="translate(166 116) rotate(-40)"><rect x="-12" y="-4.5" width="24" height="9" rx="3"/></g>
    <g transform="translate(188 100) rotate(-22)"><rect x="-12" y="-4.5" width="24" height="9" rx="3"/></g>
    <g transform="translate(228 104) rotate(18)"><rect x="-12" y="-4.5" width="24" height="9" rx="3"/></g>
    <g transform="translate(246 124) rotate(38)"><rect x="-12" y="-4.5" width="24" height="9" rx="3"/></g>
  </g>

  <!-- ceri -->
  <circle cx="200" cy="92" r="8" fill="#D2492E"/>
  <path d="M200 84 q2 -8 8 -10" stroke="#3C8B5D" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- remah -->
  <g fill="#D0923F">
    <circle cx="150" cy="222" r="2"/>
    <circle cx="252" cy="220" r="2"/>
    <circle cx="170" cy="230" r="2"/>
  </g>
</svg>
